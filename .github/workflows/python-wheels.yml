# Build one Python wheel per platform, each carrying the engine it needs.
#
# The Python package is a bridge to the `fathom` engine, so a wheel without that
# binary installs perfectly and then cannot describe anything. `py-pkg/fathom/setup.py`
# does the packing; this only builds the engine for each platform and hands it
# over.
#
# **The tag a wheel needs is not the one a build machine reports**: PyPI rejects
# a bare `linux_x86_64`, and a macOS wheel claims its deployment target rather
# than the runner's version, so `FATHOM_WHEEL_PLAT` overrides what setuptools
# would infer. That is the whole reason `setup.py` reads an environment variable
# there rather than trusting `bdist_wheel`.
#
# Nothing here publishes. The wheels are uploaded as artifacts so they can be
# downloaded and tried; a release workflow is what would send them to PyPI.
#
# **The distribution is `fathom-json` and the import is `fathom`.** The short
# name was taken on PyPI in 2011 by an unrelated project whose last release
# predates Google Code's shutdown; a PEP 541 request is the route to it. The
# checks below import `fathom`, which does not change either way.
#
# Actions are pinned to commits, the same as every other workflow here.

name: python wheels

on:
  push:
    branches: [main]
    paths:
      - "py-pkg/fathom/**"
      - "fathom-core/**"
      - "fathom-cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/python-wheels.yml"
  workflow_dispatch:

# Read-only, stated rather than inherited: this workflow builds and tests wheels
# and pushes nothing anywhere.
permissions:
  contents: read

concurrency:
  group: python-wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: ${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            tag: macosx_11_0_arm64
            macos_target: "11.0"
          # The Intel wheel is cross-compiled from the Apple Silicon runner
          # rather than built on `macos-13`. That image is the last Intel one and
          # GitHub is retiring it; the sibling measured a job that never
          # *started*, queued 55 minutes while four others finished.
          - os: macos-14
            tag: macosx_10_12_x86_64
            macos_target: "10.12"
            rust_target: x86_64-apple-darwin
          # The manylinux image is what makes the wheel installable on any
          # reasonably modern Linux: it pins an old enough glibc that the binary
          # does not demand the build machine's.
          - os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            tag: manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            tag: manylinux_2_28_aarch64
          - os: windows-latest
            tag: win_amd64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust_target }}

      # A cross build lands in `target/<triple>/release/`, which is not where
      # `setup.py` looks, so the path is handed over explicitly. Native builds
      # keep using the hook's own walk-up.
      - name: Build the engine
        shell: bash
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            cargo build --release -p fathom-cli --target "${{ matrix.rust_target }}"
            echo "FATHOM_BIN=$PWD/target/${{ matrix.rust_target }}/release/fathom" >> "$GITHUB_ENV"
          else
            cargo build --release -p fathom-cli
          fi
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}

      - name: Set up Python
        if: ${{ !matrix.container }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # The manylinux image ships several Pythons and no `python` on PATH; any of
      # them can build this wheel, because it holds no compiled extension module.
      # That is also why one wheel per platform is enough rather than one per
      # interpreter version: the tag is `py3-none-<platform>`.
      - name: Build the wheel
        shell: bash
        run: |
          PYTHON=python
          if [ -n "${{ matrix.container }}" ]; then PYTHON=/opt/python/cp312-cp312/bin/python; fi
          "$PYTHON" -m pip install --upgrade build
          FATHOM_WHEEL_PLAT="${{ matrix.tag }}" "$PYTHON" -m build --wheel --outdir dist py-pkg/fathom

          # Assert rather than assume. `setup.py` raises if it can find no engine
          # at all, but nothing checks that the engine reached the *archive* — a
          # packaging rule that quietly stopped matching would ship a wheel that
          # installs and then cannot answer.
          "$PYTHON" - <<'PY'
          import glob, sys, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          if not any(n.startswith("fathom/bin/fathom") for n in names):
              print(f"::error::{wheel} carries no engine under fathom/bin/")
              sys.exit(1)
          print(f"{wheel} carries the engine")
          PY

      # The check that matters: install what was just built somewhere with no
      # checkout in sight, unset every hint, and describe a document.
      #
      # The cross-compiled Intel wheel is the one entry that cannot always run
      # its own engine, because the runner is Apple Silicon. So the architecture
      # is asserted from the packed file either way, and the run is attempted
      # only when Rosetta answers — never skipped silently, and never softened
      # into a check that would pass on a broken engine.
      - name: Prove it answers with no toolchain and no checkout
        shell: bash
        run: |
          PYTHON=python
          if [ -n "${{ matrix.container }}" ]; then PYTHON=/opt/python/cp312-cp312/bin/python; fi

          # **A cross-compiled wheel cannot be pip-installed here, and that is
          # pip working correctly.** It is tagged `macosx_10_12_x86_64` and this
          # runner is Apple Silicon, so pip refuses it on the tag before any
          # check below is reached. Unpacking asks what the artifact *contains*,
          # which does not need it installed.
          if [ -n "${{ matrix.rust_target }}" ]; then
            WHEEL="$(ls dist/*.whl)"
            rm -rf /tmp/unpacked && mkdir -p /tmp/unpacked
            "$PYTHON" -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall('/tmp/unpacked')" "$WHEEL"

            ENGINE=/tmp/unpacked/fathom/bin/fathom
            test -f "$ENGINE" || { echo "::error::the wheel carries no engine at fathom/bin/fathom"; exit 1; }
            file "$ENGINE"
            file "$ENGINE" | grep -q "executable x86_64" \
              || { echo "::error::cross-compiled wheel does not carry an x86_64 engine"; exit 1; }

            if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
              echo "::warning::Rosetta is absent, so this runner cannot execute the Intel engine — architecture verified, answering not attempted"
              exit 0
            fi
            echo "Rosetta answers; running the Intel engine under it"
            chmod +x "$ENGINE"
            printf '{"items":[{"a":1},{"a":2},{"a":3}]}' > /tmp/d.json
            arch -x86_64 "$ENGINE" probe /tmp/d.json > /tmp/out.txt
            grep -qi "ONE ROW COULD BE" /tmp/out.txt \
              || { echo "::error::the Intel engine did not describe the document"; cat /tmp/out.txt; exit 1; }
            echo "described $(wc -c < /tmp/out.txt) bytes with the shipped Intel engine"
            exit 0
          fi

          "$PYTHON" -m venv /tmp/check
          # Windows puts a venv's programs in `Scripts`, every other platform in
          # `bin`, and this job runs on both.
          BIN=/tmp/check/bin
          [ -d /tmp/check/Scripts ] && BIN=/tmp/check/Scripts
          "$BIN"/pip install dist/*.whl

          # The engine that actually shipped, wherever pip put it.
          ENGINE="$("$BIN"/python -c 'import fathom, os; print(os.path.join(os.path.dirname(fathom.__file__), "bin", "fathom.exe" if os.name == "nt" else "fathom"))')"
          test -f "$ENGINE" || { echo "::error::the wheel carries no engine at $ENGINE"; exit 1; }

          cd /tmp
          unset FATHOM_BIN
          "$BIN"/python -c "
          import json, fathom
          json.dump({'items': [{'a': 1, 'b': 'x'}, {'a': 2, 'b': 'y'}, {'a': 3, 'b': 'z'}]}, open('d.json', 'w'))
          t = fathom.rows(fathom.read_json('d.json'), 'an item of items')
          assert len(t) == 3, t
          print('described and extracted', len(t), 'rows with the shipped engine')
          print('engine:', fathom.binary())
          "

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.tag }}
          path: dist/*.whl
