# The Python binding. NOT the environment — the eight comparison tools live in
# the pyproject.toml at the project root, which is deliberately not a package.
# This one is the package, and it has no dependencies at all: it invokes the
# `fathom` binary as a subprocess and reads what it prints.

[project]
name = "fathom"
version = "0.0.1"
description = "See what is in a JSON document before you parse it"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "psychometrician", email = "psychometrician@gmail.com" }]
keywords = ["json", "ndjson", "explore", "schema", "rectangling"]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fathom"]
